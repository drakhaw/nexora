name: Release

# Push a tag such as v0.1.0 to build a signed APK and publish a GitHub Release.
# The tag must match versionName in app/build.gradle.kts.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   NEXORA_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   NEXORA_KEYSTORE_PASSWORD  keystore password
#   NEXORA_KEY_ALIAS          key alias
#   NEXORA_KEY_PASSWORD       key password

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXORA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::NEXORA_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "NEXORA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed APK
        env:
          NEXORA_KEYSTORE_PASSWORD: ${{ secrets.NEXORA_KEYSTORE_PASSWORD }}
          NEXORA_KEY_ALIAS: ${{ secrets.NEXORA_KEY_ALIAS }}
          NEXORA_KEY_PASSWORD: ${{ secrets.NEXORA_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify "$apk"
          cp "$apk" "nexora-$VERSION.apk"
          sha256sum "nexora-$VERSION.apk" > "nexora-$VERSION.apk.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          name: Nexora ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            nexora-${{ env.VERSION }}.apk
            nexora-${{ env.VERSION }}.apk.sha256

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
